name: ghcr-publish

# BUMP-JIRA-AUDIT: jira_major / jira_minor_patch defaults. Match
# Dockerfile JIRA_VERSION ARG (split here so the tag scheme can compose
# :<major>.<minor.patch> primary, :<major>-latest floating, plus the
# warmed-variant suffixes :<...>-warm / :<major>-warm-latest).
on:
  workflow_dispatch:
    inputs:
      jira_major:
        description: "Jira major version (e.g. 9)"
        required: true
        type: string
        default: "9"
      jira_minor_patch:
        description: "Jira minor.patch (e.g. 12.34)"
        required: true
        type: string
        default: "12.34"
      tag_latest:
        description: "Also push :<major>[-warm]-latest (e.g. :9-latest or :9-warm-latest)"
        required: false
        type: boolean
        default: false
      tag_warm:
        description: "Build the warmed variant (--target warmed) and push :<version>-warm"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jira-software-standalone
  JIRA_VERSION: ${{ inputs.jira_major }}.${{ inputs.jira_minor_patch }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Unwarmed: build ~5min + smoke ~15min + push ~5min = ~25min.
    # Warmed:  build ~5min + warmer-stage boot ~15-25min + smoke ~3min
    #          + push ~5min = ~50min. 90min ceiling is comfortable.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build target + tag suffix
        id: vars
        # tag_warm picks the multi-stage build target and the tag
        # suffix together so they cannot drift. -warm comes BEFORE
        # -latest in the floating tag (e.g. :9-warm-latest).
        run: |
          if [ '${{ inputs.tag_warm }}' = 'true' ]; then
            echo "target=warmed" >> "$GITHUB_OUTPUT"
            echo "suffix=-warm" >> "$GITHUB_OUTPUT"
          else
            echo "target=unwarmed" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        run: |
          docker build \
            --target '${{ steps.vars.outputs.target }}' \
            --build-arg JIRA_VERSION='${{ env.JIRA_VERSION }}' \
            -t '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}${{ steps.vars.outputs.suffix }}' \
            .

      - name: Smoke test
        run: |
          bash scripts/smoke.sh \
            '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}${{ steps.vars.outputs.suffix }}' \
            '${{ env.JIRA_VERSION }}' \
            artifacts

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ env.JIRA_VERSION }}${{ steps.vars.outputs.suffix }}
          path: artifacts/
          if-no-files-found: warn

      - name: Push primary tag
        run: docker push '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}${{ steps.vars.outputs.suffix }}'

      - name: Push floating tag
        if: inputs.tag_latest
        run: |
          SRC='${{ env.IMAGE }}:${{ env.JIRA_VERSION }}${{ steps.vars.outputs.suffix }}'
          DST='${{ env.IMAGE }}:${{ inputs.jira_major }}${{ steps.vars.outputs.suffix }}-latest'
          docker tag "$SRC" "$DST"
          docker push "$DST"

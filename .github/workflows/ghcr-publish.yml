name: ghcr-publish

# BUMP-JIRA-AUDIT: jira_major / jira_minor_patch defaults. Match
# Dockerfile JIRA_VERSION ARG (split here so the tag scheme can compose
# :<major>.<minor.patch> primary, :<major>-latest floating, and a
# reserved :<...>-warm path without re-parsing a single string input).
on:
  workflow_dispatch:
    inputs:
      jira_major:
        description: "Jira major version (e.g. 11)"
        required: true
        type: string
        default: "11"
      jira_minor_patch:
        description: "Jira minor.patch (e.g. 3.4)"
        required: true
        type: string
        default: "3.4"
      tag_latest:
        description: "Also push :<major>-latest (e.g. :11-latest)"
        required: false
        type: boolean
        default: false
      tag_warm:
        description: "Reserved for future warmed-variant tags (currently no-op)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jira-software-standalone
  JIRA_VERSION: ${{ inputs.jira_major }}.${{ inputs.jira_minor_patch }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Cold boot of Jira 11 is 10-20min; smoke + push overhead = 60min ceiling.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        # tag_warm is reserved for the warmed-variant tag scheme
        # (:<version>-warm and :<major>-warm-latest). Fail fast before
        # any build work so a flag set in error does not produce a
        # half-completed run; remove this guard when the warmer build
        # path lands in this repository.
        run: |
          if [ '${{ inputs.tag_warm }}' = 'true' ]; then
            echo "::error::tag_warm is reserved for the future warmed-variant build path; the warmer is not yet integrated into this repository. Re-run with tag_warm=false."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg JIRA_VERSION='${{ env.JIRA_VERSION }}' \
            -t '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}' \
            .

      - name: Smoke test
        run: |
          bash scripts/smoke.sh \
            '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}' \
            '${{ env.JIRA_VERSION }}' \
            artifacts

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ env.JIRA_VERSION }}
          path: artifacts/
          if-no-files-found: warn

      - name: Push primary tag
        run: docker push '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}'

      - name: Push :<major>-latest
        if: inputs.tag_latest
        run: |
          docker tag '${{ env.IMAGE }}:${{ env.JIRA_VERSION }}' '${{ env.IMAGE }}:${{ inputs.jira_major }}-latest'
          docker push '${{ env.IMAGE }}:${{ inputs.jira_major }}-latest'
